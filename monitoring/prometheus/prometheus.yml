# `${ENV}` 치환에는 Compose의 expand-external-labels 플래그가 필요하다.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: "${ENV}"             # Compose .env 의 ENV 가 expand-external-labels 로 치환
    cluster: krip             # 멀티 클러스터 진입 시 라벨 공간 분리

scrape_configs:
  - job_name: prometheus-self
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: loki-self
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy-self
    static_configs:
      - targets: ["alloy:12345"]

  # macOS에서는 linux-host profile이 꺼져 이 target이 down인 것이 정상이다.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # backend client latency와 중복되는 고카디널리티 server latency series를 버린다.
  - job_name: redis-hot
    static_configs:
      - targets: ["redis-exporter-hot:9121"]
        labels:
          db: "hot"           # §5.7 hot/dedupe 분리
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'redis_(commands_latencies_usec|latency_percentiles_usec|latency_spike).*'
        action: drop

  - job_name: redis-dedupe
    static_configs:
      - targets: ["redis-exporter-dedupe:9121"]
        labels:
          db: "dedupe"
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'redis_(commands_latencies_usec|latency_percentiles_usec|latency_spike).*'
        action: drop

  # unused mongodb_* series는 버리되 Prometheus가 합성하는 up liveness는 보존한다.
  - job_name: mongo
    static_configs:
      - targets: ["mongodb-exporter:9216"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'mongodb_.*'
        action: drop

  - job_name: blackbox-external
    metrics_path: /probe
    params:
      module: [http_alive]            # 외부 API 는 root GET 에 4xx 가 정상 — alive probe 사용
    static_configs:
      - targets:
          - https://kr.object.ncloudstorage.com         # Naver Cloud S3
          - https://naveropenapi.apigw.ntruss.com       # Papago
          - https://generativelanguage.googleapis.com   # Gemini
          - https://fcm.googleapis.com                  # FCM
          - https://oauth2.googleapis.com               # Google OAuth
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
    scrape_interval: 60s        # 외부는 보수적 — rate limit 회피
    scrape_timeout: 15s         # 외부 latency 여유

  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:9090"]
    scrape_interval: 15s

  # RED에서 제외된 deep/ready를 synthetic probe로 측정한다.
  - job_name: blackbox-internal
    metrics_path: /probe
    params:
      module: [http_2xx]            # 외부 의존성과 달리 2xx만 허용
    static_configs:
      - targets:
          - http://backend:8000/health
          - http://backend:8000/health/deep
          - http://backend:8000/ready
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
    scrape_interval: 30s
    scrape_timeout: 10s             # /health/deep PG ping latency 여유
