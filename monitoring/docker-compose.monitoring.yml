# 메인 Compose와 함께 사용한다. 실행법은 monitoring/README.md 참고.

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: krip-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"           # E-16 / K-3 — ~2-3GB
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"                      # config reload 가능
      - "--enable-feature=expand-external-labels"     # G-1 — ${ENV} 치환 활성화
    environment:
      ENV: ${ENV:-DEV}                                # G-1 — Prometheus 가 external_labels 의 ${ENV} 치환에 사용
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks:
      - monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:11.3.1
    container_name: krip-grafana
    ports:
      - "3001:3000"                                   # 호스트 3001 → 컨테이너 3000
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    environment:
      # 기본 비밀번호로 기동하지 않는다.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: ""
    networks:
      - monitoring-network
    depends_on:
      - prometheus
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: krip-blackbox
    command:
      - "--config.file=/etc/blackbox/blackbox.yml"
    volumes:
      - ./monitoring/blackbox:/etc/blackbox:ro
    networks:
      - monitoring-network
    restart: unless-stopped

  # macOS는 rslave를 지원하지 않고 VM 메트릭만 보여 Linux 운영 profile로 제한한다.
  node-exporter:
    profiles: ["linux-host"]
    image: prom/node-exporter:v1.8.2
    container_name: krip-node-exporter
    command:
      - "--path.rootfs=/host"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring-network
    pid: host
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: krip-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-cho}:${POSTGRES_PASSWORD:-hyeonsang}@postgres:5432/${POSTGRES_NAME:-chohyeonsang}?sslmode=disable"
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"
    networks:
      - krip-network
      - monitoring-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  mongodb-exporter:
    image: percona/mongodb_exporter:0.43.1
    container_name: krip-mongodb-exporter
    command:
      - "--mongodb.uri=mongodb://${MONGODB_USER:-cho}:${MONGODB_PASSWORD:-hyeonsang}@mongodb:27017/admin?authSource=admin"
      - "--collect-all"
      - "--compatible-mode"
    networks:
      - krip-network
      - monitoring-network
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  redis-exporter-hot:
    image: oliver006/redis_exporter:v1.66.0
    container_name: krip-redis-exporter-hot
    environment:
      REDIS_ADDR: "redis://redis:6379/0"
    networks:
      - krip-network
      - monitoring-network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis-exporter-dedupe:
    image: oliver006/redis_exporter:v1.66.0
    container_name: krip-redis-exporter-dedupe
    environment:
      REDIS_ADDR: "redis://redis:6379/1"
    networks:
      - krip-network
      - monitoring-network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.1
    container_name: krip-loki
    command:
      - "-config.file=/etc/loki/loki-config.yml"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # backend log volume을 read-only로 공유해 active/회전 파일을 모두 추적한다.
  alloy:
    image: grafana/alloy:v1.17.1
    container_name: krip-alloy
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    environment:
      ENV: ${ENV:-DEV}
      NODE_ID: ${NODE_ID:-krip-backend}
      LOKI_URL: http://loki:3100/loki/api/v1/push
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - backend-logs:/backend/logs:ro
      - alloy-data:/var/lib/alloy/data
    networks:
      - monitoring-network
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

volumes:
  prometheus-data:
    name: krip-prometheus-data
  grafana-data:
    name: krip-grafana-data
  backend-logs:
    name: krip-backend-logs
  loki-data:
    name: krip-loki-data
  alloy-data:
    name: krip-alloy-data
