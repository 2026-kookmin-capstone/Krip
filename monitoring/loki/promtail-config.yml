# Promtail 설정
#
# backend 의 /backend/logs/app.log 와 회전된 .gz 파일을 tail 해서 Loki 로 push 한다.
# loguru serialize=True 출력의 JSON 스키마를 그대로 파싱한다.
#
# 라벨 정책:
#   - 라벨: app, env, node_id, level (저카디널리티)
#   - 본문 필드: logger_name, request_id, user_id (LogQL `| json` 으로 검색)
#   - 고유 ID 라벨화 절대 금지.
#
# 회전 추적:
#   loguru 는 splitext 기반이라 app.log -> app.<타임스탬프>.log 로 회전 후
#   LOG_COMPRESSION=gz 로 app.<타임스탬프>.log.gz 가 된다 (app.log.<...>.gz 아님 — glob 주의).
#   Promtail 3.x 의 decompression 은 pipeline_stage 가 아닌 scrape_config 레벨 옵션이라
#   잡을 두 개로 분리한다 (현재 파일 / 회전 .gz). stages 는 YAML anchor 로 동일 재사용.
#
#   중복 처리: 회전 잡은 라이브 잡이 이미 보낸 라인을 .gz 에서 재수집한다. 아래 timestamp
#   스테이지가 record.time 으로 이벤트 시각을 고정하므로 (ts+labels+line) 이 완전히 일치 →
#   Loki 가 쿼리 시 동일 엔트리로 dedup 한다. timestamp 스테이지가 없으면 각 잡의 read-time
#   으로 찍혀 서로 다른 엔트리가 되어 중복이 남고, 백필 로그도 재생 시점으로 오기록된다.
#
# PII 마스킹:
#   ingestion 단에서 정규식 강제. 코드 리뷰 누락이 14일 보존 + 검색 가능한 로그 남기는 사고 방지.

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: krip                       # auth_enabled=false 일 땐 Loki 가 무시

scrape_configs:
  # 현재 파일 (회전 전).
  - job_name: krip-backend
    static_configs:
      - labels:
          app: krip-backend
          env: ${ENV}
          node_id: ${NODE_ID}
          __path__: /backend/logs/app.log
    pipeline_stages: &pipeline
      # loguru serialize=True 스키마.
      # 검증된 키 경로:
      #   record.level.name, record.extra.logger_name, record.extra.request_id,
      #   record.extra.user_id, record.message
      - json:
          expressions:
            level: record.level.name
            logger_name: record.extra.logger_name
            request_id: record.extra.request_id
            user_id: record.extra.user_id
            message: record.message
            timestamp: record.time.repr

      # 이벤트 시각을 로그 레코드 기준으로 고정.
      # 라이브/회전 잡이 같은 라인을 동일 ts 로 찍어 Loki dedup 이 재수집분을 흡수하고,
      # reject_old_samples(168h)·시간 범위 쿼리가 실제 발생 시각을 따르게 한다.
      # loguru repr 예: "2026-07-09 15:50:07.716194+09:00" (항상 tz offset 포함,
      # 소수 초는 0 일 때 생략되므로 .999999 로 optional 처리). Go layout 파싱.
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05.999999-07:00'

      # PII 마스킹 4종.
      - replace:
          expression: '([\w.+-]+@[\w-]+\.[\w.-]+)'
          replace: '<email>'
      - replace:
          expression: '(eyJ[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+)'
          replace: '<jwt>'
      - replace:
          expression: '\b(01[016789]-?\d{3,4}-?\d{4})\b'
          replace: '<phone>'
      - replace:
          expression: '\b(\d{6}-?[1-4]\d{6})\b'
          replace: '<rrn>'

      # 라벨화 — level 만 인덱스 라벨.
      # logger_name / request_id / user_id 는 본문 필드로 LogQL `| json` 검색.
      - labels:
          level:

  # 회전된 .gz 파일. decompression 은 scrape_config 레벨에서 활성화.
  - job_name: krip-backend-rotated
    decompression:
      enabled: true
      format: gz
    static_configs:
      - labels:
          app: krip-backend
          env: ${ENV}
          node_id: ${NODE_ID}
          __path__: /backend/logs/app.*.log.gz
    pipeline_stages: *pipeline
