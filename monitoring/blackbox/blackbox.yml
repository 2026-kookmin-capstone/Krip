modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: []
      method: GET
      follow_redirects: true
      fail_if_ssl: false
      fail_if_not_ssl: false
      tls_config:
        insecure_skip_verify: false

  # 외부 API는 인증된 4xx도 alive로 보고 5xx/연결 실패만 장애로 본다.
  http_alive:
    prober: http
    timeout: 15s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: [200, 201, 204, 301, 302, 304, 400, 401, 403, 404]
      method: GET
      follow_redirects: false       # redirect 자체가 alive 신호
      fail_if_ssl: false
      fail_if_not_ssl: true         # HTTPS 강제
      tls_config:
        insecure_skip_verify: false
