services:
  postgres:
    image: postgres:14
    container_name: krip_smoke_postgres
    environment:
      POSTGRES_USER: cho
      POSTGRES_PASSWORD: hyeonsang
      POSTGRES_DB: chohyeonsang
    # 호스트 native postgres/mongod 와 충돌 방지 — smoke 전용 고정 포트
    ports:
      - "5532:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cho -d chohyeonsang"]
      interval: 1s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    container_name: krip_smoke_redis
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6479:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  mongo:
    image: mongo:6
    container_name: krip_smoke_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: cho
      MONGO_INITDB_ROOT_PASSWORD: hyeonsang
      MONGO_INITDB_DATABASE: chohyeonsang
    ports:
      - "27117:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')", "-u", "cho", "-p", "hyeonsang", "--authenticationDatabase", "admin"]
      interval: 2s
      timeout: 5s
      retries: 30
